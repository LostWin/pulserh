# =============================================================================
# Pulse AI Backend — Docker Compose (développement & staging)
# =============================================================================
#
# Usage :
#   cp .env.example .env           # Configurer les variables
#   docker compose up -d           # Démarrer tous les services
#   docker compose logs -f api     # Voir les logs du backend
#   docker compose down            # Arrêter tout
#
# Réseau : pulse_network (bridge) — tous les services communiquent entre eux.
# Traefik : route api.pulse.local → pulse-ai-backend:8000 avec TLS.
# =============================================================================

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # Pulse AI Backend (FastAPI)
  # ═══════════════════════════════════════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-ai-backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - pulse_network
    # --- Labels Traefik (15.3) ---
    labels:
      - "traefik.enable=true"
      # Routeur HTTP → HTTPS redirect
      - "traefik.http.routers.pulse-api-http.rule=Host(`api.pulse.local`)"
      - "traefik.http.routers.pulse-api-http.entrypoints=web"
      - "traefik.http.routers.pulse-api-http.middlewares=redirect-to-https"
      # Routeur HTTPS principal
      - "traefik.http.routers.pulse-api.rule=Host(`api.pulse.local`)"
      - "traefik.http.routers.pulse-api.entrypoints=websecure"
      - "traefik.http.routers.pulse-api.tls=true"
      - "traefik.http.routers.pulse-api.tls.certresolver=letsencrypt"
      # Service backend
      - "traefik.http.services.pulse-api.loadbalancer.server.port=8000"
      # Middleware HTTPS redirect
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
      # Middleware rate limiting Traefik (couche supplémentaire)
      - "traefik.http.middlewares.pulse-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.pulse-ratelimit.ratelimit.burst=50"
      - "traefik.http.routers.pulse-api.middlewares=pulse-ratelimit"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ═══════════════════════════════════════════════════════════════════════════
  # PostgreSQL
  # ═══════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulse_db
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pulse_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse} -d pulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # Redis
  # ═══════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: pulse-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pulse_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # Keycloak (IAM / SSO)
  # ═══════════════════════════════════════════════════════════════════════════
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: pulse-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/pulse_db
      KC_DB_USERNAME: ${POSTGRES_USER:-pulse}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-pulse_secret}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: keycloak.pulse.local
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pulse_network

  # ═══════════════════════════════════════════════════════════════════════════
  # MinIO (Stockage objet S3-compatible)
  # ═══════════════════════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: pulse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - pulse_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # Qdrant (Vector Database)
  # ═══════════════════════════════════════════════════════════════════════════
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pulse-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - pulse_network

  # ═══════════════════════════════════════════════════════════════════════════
  # Traefik (Reverse Proxy + TLS)
  # ═══════════════════════════════════════════════════════════════════════════
  traefik:
    image: traefik:v3.1
    container_name: pulse-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=pulse_network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # TLS — Let's Encrypt (staging pour le dev, passer à prod pour la production)
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@pulse.local}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
    ports:
      - "80:80"
      - "443:443"
      - "8082:8080"   # Dashboard Traefik
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - traefik_certs:/letsencrypt
    networks:
      - pulse_network

# ═══════════════════════════════════════════════════════════════════════════
# Volumes persistants
# ═══════════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  traefik_certs:

# ═══════════════════════════════════════════════════════════════════════════
# Réseau interne
# ═══════════════════════════════════════════════════════════════════════════
networks:
  pulse_network:
    driver: bridge
