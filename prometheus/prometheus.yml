global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: pulse-rh

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ['pulse_keycloak:9000']
