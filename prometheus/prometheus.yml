global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: pulse-rh

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ['pulse_keycloak:9000']

  - job_name: postgres
    static_configs:
      - targets: ['pulse_postgres_exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['pulse_redis_exporter:9121']

  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets: ['pulse_traefik:8080']

  - job_name: node
    static_configs:
      - targets: ['pulse_node_exporter:9100']
