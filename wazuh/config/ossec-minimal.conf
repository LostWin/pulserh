<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
  </global>

  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>udp</protocol>
    <allowed-ips>0.0.0.0/0</allowed-ips>
  </remote>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
  </remote>

  <alerts>
    <log_alert_level>3</log_alert_level>
  </alerts>

  <ruleset>
    <include>rules_config.xml</include>
    <include>pulse_rules.xml</include>
  </ruleset>

  <indexer>
    <enabled>yes</enabled>
    <hosts>
      <host>https://wazuh-indexer:9200</host>
    </hosts>
    <ssl>
      <certificate_authorities>
        <ca>/etc/ssl/wazuh/root-ca.pem</ca>
      </certificate_authorities>
      <certificate>/etc/ssl/wazuh/manager.pem</certificate>
      <key>/etc/ssl/wazuh/manager.key</key>
    </ssl>
  </indexer>

  <api>
    <enabled>yes</enabled>
    <port>55000</port>
    <use_http>no</use_http>
    <https>yes</https>
    <https_key>/etc/ssl/wazuh/manager.key</https_key>
    <https_cert>/etc/ssl/wazuh/manager.pem</https_cert>
    <https_use_ca>no</https_use_ca>
  </api>
</ossec_config>
