---
_meta:
  type: "config"
  config_version: 2

config:
  dynamic:
    http:
      anonymous_auth_enabled: false
      xff:
        enabled: false
        internalProxies: '.*'
    authc:
      openid_auth_domain:
        description: "Authenticate via Keycloak OpenID Connect"
        http_enabled: true
        transport_enabled: false
        order: 0
        http_authenticator:
          type: openid
          challenge: false
          config:
            subject_key: preferred_username
            roles_key: roles
            # URL interne Docker — évite les problèmes TLS back-channel
            openid_connect_url: "http://pulse_keycloak:8080/realms/pulse/.well-known/openid-configuration"
            # jwks_uri forcé en HTTP interne — évite que l'indexer contacte https://auth.pulse.local
            jwks_uri: "http://pulse_keycloak:8080/realms/pulse/protocol/openid-connect/certs"
            openid_connect_idp:
              enable_ssl: false
              verify_hostnames: false
        authentication_backend:
          type: noop

      basic_internal_auth_domain:
        description: "Authenticate via HTTP Basic against internal users database"
        http_enabled: true
        transport_enabled: true
        order: 4
        http_authenticator:
          type: basic
          challenge: true
        authentication_backend:
          type: intern
