---
# Wazuh admin → accès complet OpenSearch
all_access:
  reserved: false
  backend_roles:
    - "admin"
  description: "Maps Keycloak admin role to all_access"

# Utilisateurs RH/Manager/Direction → accès lecture Wazuh
kibana_user:
  reserved: false
  backend_roles:
    - "collaborator"
    - "manager"
    - "rh"
    - "direction"

readall:
  reserved: false
  backend_roles:
    - "collaborator"
    - "manager"
    - "rh"
    - "direction"

# Compte interne kibanaserver pour le dashboard
kibana_server:
  reserved: true
  users:
    - "kibanaserver"

own_index:
  reserved: false
  users: []
  description: "Disabled"
