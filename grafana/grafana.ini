[server]
domain = grafana.pulse.local
root_url = https://grafana.pulse.local

[auth]
disable_login_form = false
oauth_auto_login = false

[auth.generic_oauth]
enabled = true
name = Keycloak
allow_sign_up = true
client_id = grafana
client_secret = PulseRH_GrafanaSecret_2026
scopes = openid email profile roles
auth_url = https://auth.pulse.local/realms/pulse/protocol/openid-connect/auth
token_url = http://pulse_keycloak:8080/realms/pulse/protocol/openid-connect/token
api_url = http://pulse_keycloak:8080/realms/pulse/protocol/openid-connect/userinfo
role_attribute_path = contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'hr') && 'Editor' || contains(roles[*], 'manager') && 'Editor' || 'Viewer'
role_attribute_strict = false
use_pkce = true

[security]
admin_user = admin
admin_password = PulseRH_AdminKC_2026Secure
secret_key = PulseRH_Grafana_SecretKey_2026
cookie_secure = true
cookie_samesite = lax

[users]
auto_assign_org = true
auto_assign_org_role = Viewer
